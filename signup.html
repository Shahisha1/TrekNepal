<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - TrekNepal</title>
    <link rel="icon" type="image/x-icon" href="asset/Logo.png" />
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <nav class="header-nav">
        <div class="logo-text"><a href="index.html"> <img src="asset/Logo.png" alt="TrekNepal Logo" height="50" width="50" /> TrekNepal</a></div>
        <ul class="nav-items"> 
            <li><a href="index.html">Home</a></li>
            <li><a href="routes.html">Routes</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="compare.html">Compare</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="FAQ.html">FAQ</a></li>
            <li><a href="profile.html">Profile</a></li>
        </ul>
        <div class="auth-buttons">
            <a href="login.html" class="outline-btn small-btn">Sign In</a>
            <a href="signup.html" class="main-btn small-btn active">Sign Up</a>
        </div>
        <button class="mobile-menu-btn">Menu</button>
    </nav>
    <div class="auth-page">
        <div class="auth-box" style="max-width: 480px">
            <div class="auth-logo">TrekNepal</div>
            <h1 class="auth-title">Create an account</h1>
            <p class="auth-sub">
                Already signed up? <a href="login.html">Sign in instead</a>
            </p>
            <div class="steps">
                <div class="step active" id="signup-step1-indicator">
                    <div class="dot" id="signup-step1-dot">1</div>
                    Account
                </div>
                <div class="line"></div>
                <div class="step" id="signup-step2-indicator">
                    <div class="dot" id="signup-step2-dot">2</div>
                    Details
                </div>
                <div class="line"></div>
                <div class="step" id="signup-step3-indicator">
                    <div class="dot" id="signup-step3-dot">3</div>
                    Done
                </div>
            </div>
            <div class="success-panel" id="signup-success">
                Account created. This demo does not save data.
            </div>
            <form id="signup-form" novalidate>
                <div id="signup-step1">
                    <div class="two-columns">
                        <div class="form-field">
                            <label class="field-label" for="signup-first-name">First name *</label>
                            <input class="field-input" type="text" id="signup-first-name" placeholder="First name"
                                autocomplete="given-name" />
                            <div class="error-text" id="signup-first-name-error"></div>
                        </div>
                        <div class="form-field">
                            <label class="field-label" for="signup-last-name">Last name *</label>
                            <input class="field-input" type="text" id="signup-last-name" placeholder="Last name"
                                autocomplete="family-name" />
                            <div class="error-text" id="signup-last-name-error"></div>
                        </div>
                    </div>
                    <div class="form-field">
                        <label class="field-label" for="signup-email">Email <span style="color: red;">*</span></label>
                        <input class="field-input" type="email" id="signup-email" placeholder="name@email.com"
                            autocomplete="email" />
                        <div class="error-text" id="signup-email-error"></div>
                    </div>
                    <div class="form-field">
                        <label class="field-label" for="signup-password">Password <span
                                style="color: red;">*</span></label>
                        <div class="input-wrap">
                            <input class="field-input" type="password" id="signup-password"
                                placeholder="At least 6 characters" autocomplete="new-password" />
                            <button type="button" class="pw-toggle" id="signup-toggle-pw1">
                                Show
                            </button>
                        </div>
                        <div class="strength-meter">
                            <div class="strength-meter-fill" id="signup-strength-fill"></div>
                        </div>
                        <div class="strength-meter-text" id="signup-strength-text">
                            Enter a password
                        </div>
                        <div class="error-text" id="signup-password-error"></div>
                    </div>
                    <div class="form-field">
                        <label class="field-label" for="signup-password-confirm">Confirm password <span
                                style="color: red;">*</span></label>
                        <div class="input-wrap">
                            <input class="field-input" type="password" id="signup-password-confirm"
                                placeholder="Repeat password" autocomplete="new-password" />
                            <button type="button" class="pw-toggle" id="signup-toggle-pw2">
                                Show
                            </button>
                        </div>
                        <div class="error-text" id="signup-password-confirm-error"></div>
                    </div>
                    <button type="button" class="main-btn wide-btn" id="signup-next">
                        Continue
                    </button>
                </div>
                <div id="signup-step2" style="display: none">
                    <div class="form-field">
                        <label class="field-label" for="signup-country">Where are you from?</label>
                        <select class="field-select" id="signup-country">
                            <option value="">Select a country</option>
                            <option value="Nepal">Nepal</option>
                            <option value="India">India</option>
                            <option value="USA">USA</option>
                            <option value="UK">UK</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-field">
                        <label class="field-label" for="signup-experience">Trekking experience <span
                                style="color: red;">*</span></label>
                        <select class="field-select" id="signup-experience">
                            <option value="">Select experience</option>
                            <option value="Beginner">Beginner</option>
                            <option value="Intermediate">
                                Intermediate
                            </option>
                            <option value="Advanced">Advanced</option>
                        </select>
                        <div class="error-text" id="signup-experience-error"></div>
                    </div>
                    <div class="form-field">
                        <label class="field-label">Regions you are interested in</label>
                        <div class="tag-list">
                            <label class="tag"><input type="checkbox" value="Khumbu" />
                                Khumbu</label>
                            <label class="tag"><input type="checkbox" value="Annapurna" />
                                Annapurna</label>
                            <label class="tag"><input type="checkbox" value="Langtang" />
                                Langtang</label>
                            <label class="tag"><input type="checkbox" value="Mustang" />
                                Mustang</label>
                            <label class="tag"><input type="checkbox" value="Eastern" />
                                Eastern Nepal</label>
                        </div>
                    </div>
                    <div class="form-field">
                        <label class="field-label" for="signup-phone">Phone number (optional)</label>
                        <input class="field-input" type="tel" id="signup-phone" placeholder="+977 98XXXXXXXX" />
                    </div>
                    <div class="check-line">
                        <input type="checkbox" id="signup-terms" />
                        <label for="signup-terms">I agree to the site terms and privacy
                            policy.</label>
                    </div>
                    <div class="error-text" id="signup-terms-error"></div>
                    <div class="two-columns" style="gap: 19px">
                        <button type="button" class="outline-btn" id="signup-back">
                            Back
                        </button>
                        <button size="large" height="50px" width="100%" type="submit" class="main-btn"
                            id="signup-submit">
                            Create account
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <script src="js/main.js"></script>
    <script>
        function showError(id, message) {
            var input = document.getElementById(id);
            var error = document.getElementById(id + "-error");
            if (input) input.classList.add("has-error");
            if (error) {
                error.textContent = message;
                error.style.display = "block";
            }
        }

        function clearError(id) {
            var input = document.getElementById(id);
            var error = document.getElementById(id + "-error");
            if (input) input.classList.remove("has-error");
            if (error) error.style.display = "none";
        }

        function setupToggle(inputId, btnId) {
            var input = document.getElementById(inputId);
            var button = document.getElementById(btnId);
            if (!input || !button) return;

            button.addEventListener("click", function () {
                var isHidden = input.type === "password";
                input.type = isHidden ? "text" : "password";
                button.textContent = isHidden ? "Hide" : "Show";
            });
        }

        function getPasswordStrength(password) {
            var score = 0;
            if (password.length >= 8) score++;
            if (/[A-Z]/.test(password)) score++;
            if (/[0-9]/.test(password)) score++;
            if (/[^A-Za-z0-9]/.test(password)) score++;
            return Math.min(score, 4);
        }

        function updateStrengthMeter(password) {
            var fill = document.getElementById("signup-strength-fill");
            var text = document.getElementById("signup-strength-text");
            var levels = ["0%", "25%", "50%", "75%", "100%"];
            var colors = [
                "#ddd",
                "#f1c40f",
                "#f39c12",
                "#27ae60",
                "#2d6a4f",
            ];
            var labels = [
                "Enter a password",
                "Weak",
                "Fair",
                "Strong",
                "Very strong",
            ];
            var index =
                password.length === 0 ? 0 : getPasswordStrength(password);

            if (fill) fill.style.width = levels[index];
            if (fill) fill.style.backgroundColor = colors[index];
            if (text) text.textContent = labels[index];
        }

        function validateStep1() {
            clearError("signup-first-name");
            clearError("signup-last-name");
            clearError("signup-email");
            clearError("signup-password");
            clearError("signup-password-confirm");

            var firstName = document
                .getElementById("signup-first-name")
                .value.trim();
            var lastName = document
                .getElementById("signup-last-name")
                .value.trim();
            var email = document
                .getElementById("signup-email")
                .value.trim();
            var password = document.getElementById("signup-password").value;
            var confirmPassword = document.getElementById(
                "signup-password-confirm",
            ).value;
            var valid = true;

            if (firstName.length < 2) {
                showError("signup-first-name", "Enter your first name.");
                valid = false;
            }
            if (lastName.length < 2) {
                showError("signup-last-name", "Enter your last name.");
                valid = false;
            }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                showError("signup-email", "Enter a valid email.");
                valid = false;
            }
            if (password.length < 6) {
                showError("signup-password", "Use at least 6 characters.");
                valid = false;
            }
            if (password !== confirmPassword) {
                showError(
                    "signup-password-confirm",
                    "Passwords do not match.",
                );
                valid = false;
            }

            return valid;
        }

        function goToStep2() {
            document.getElementById("signup-step1").style.display = "none";
            document.getElementById("signup-step2").style.display = "block";
            document
                .getElementById("signup-step1-indicator")
                .classList.remove("active");
            document
                .getElementById("signup-step1-indicator")
                .classList.add("done");
            document.getElementById("signup-step1-dot").textContent = "✓";
            document
                .getElementById("signup-step2-indicator")
                .classList.add("active");
        }

        function goBackToStep1() {
            document.getElementById("signup-step2").style.display = "none";
            document.getElementById("signup-step1").style.display = "block";
            document
                .getElementById("signup-step2-indicator")
                .classList.remove("active");
            document
                .getElementById("signup-step1-indicator")
                .classList.remove("done");
            document
                .getElementById("signup-step1-indicator")
                .classList.add("active");
            document.getElementById("signup-step1-dot").textContent = "1";
        }

        function validateFinalStep() {
            clearError("signup-experience");
            clearError("signup-terms");

            var experience =
                document.getElementById("signup-experience").value;
            var termsChecked =
                document.getElementById("signup-terms").checked;
            var valid = true;

            if (!experience) {
                showError(
                    "signup-experience",
                    "Select your experience level.",
                );
                valid = false;
            }
            if (!termsChecked) {
                showError("signup-terms", "You need to agree to continue.");
                valid = false;
            }

            return valid;
        }

        setupToggle("signup-password", "signup-toggle-pw1");
        setupToggle("signup-password-confirm", "signup-toggle-pw2");

        document
            .getElementById("signup-password")
            .addEventListener("input", function () {
                updateStrengthMeter(this.value);
            });

        document
            .getElementById("signup-next")
            .addEventListener("click", function () {
                if (validateStep1()) goToStep2();
            });

        document
            .getElementById("signup-back")
            .addEventListener("click", function () {
                goBackToStep1();
            });

        document
            .getElementById("signup-form")
            .addEventListener("submit", function (event) {
                event.preventDefault();
                if (!validateFinalStep()) return;

                var button = document.getElementById("signup-submit");
                button.textContent = "Creating account...";
                button.disabled = true;

                setTimeout(function () {
                    document.getElementById(
                        "signup-success",
                    ).style.display = "flex";
                    button.textContent = "Account created";

                    // Redirect to login page after a short delay
                    setTimeout(function () {
                        window.location.href = "pages/login.html";
                    }, 1200);
                }, 900);
            });

        [
            "signup-first-name",
            "signup-last-name",
            "signup-email",
            "signup-password",
            "signup-password-confirm",
        ].forEach(function (id) {
            document
                .getElementById(id)
                .addEventListener("input", function () {
                    clearError(id);
                });
        });
    </script>
</body>

</html>
