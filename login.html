<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In - TrekNepal</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <nav class="topbar">
    <div class="brand">TrekNepal</div>
    <ul class="menu-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="routes.html">Routes</a></li>
      <li><a href="gallery.html">Gallery</a></li>
      <li><a href="compare.html">Compare</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <div class="menu-auth">
      <a href="login.html" class="btn-action btn-faint btn-small active">Sign In</a>
      <a href="signup.html" class="btn-action btn-main btn-small">Sign Up</a>
    </div>
    <button class="menu-toggle">Menu</button>
  </nav>
  <div class="auth-page">
    <div class="auth-box">
      <div class="auth-logo">TrekNepal</div>
      <h1 class="auth-title">Sign in</h1>
      <p class="auth-sub">No account yet? <a href="signup.html">Create one</a></p>
      <div class="success-panel" id="login-success">Signed in. Redirecting now</div>
      <div class="social-panel">
        <button class="btn-action btn-soft" onclick="alert('Login with Google is not active in this demo.')">Continue
          with Google</button>
        <button class="btn-action btn-soft" onclick="alert('Login with Facebook is not active in this demo.')">Continue
          with Facebook</button>
      </div>
      <div class="divider">or use your email</div>
      <form id="login-block" novalidate>
        <div class="input-group"><label class="input-label" for="login-email">Email</label><input class="input-control"
            type="email" id="login-email" placeholder="you@example.com" autocomplete="email" />
          <div class="helper-error" id="login-email-error"></div>
        </div>
        <div class="input-group"><label class="input-label" for="login-password">Password</label>
          <div class="input-wrap"><input class="input-control" type="password" id="login-password"
              placeholder="Your password" autocomplete="current-password" /><button type="button" class="pw-toggle"
              id="login-toggle-pw">Show</button></div>
          <div class="helper-error" id="login-password-error"></div>
        </div>
        <div class="form-row"><label><input type="checkbox" id="remember-me" /> Keep me signed in</label><a
            href="#">Forgot password?</a></div>
        <button type="submit" class="btn-action btn-main btn-full">Sign in</button>
        <p style="text-align:center; font-size:0.8rem; color:#a8a197; margin-top:16px;">By signing in you agree to our
          Terms and Privacy Policy.</p>
      </form>
    </div>
  </div>
  <script src="js/main.js"></script>
  <script>
    var loginPw = document.getElementById('login-password');
    var loginToggle = document.getElementById('login-toggle-pw');
    loginToggle.addEventListener('click', function () {
      if (loginPw.type === 'password') { loginPw.type = 'text'; loginToggle.textContent = 'Hide'; }
      else { loginPw.type = 'password'; loginToggle.textContent = 'Show'; }
    });
    function showError(id, msg) { var field = document.getElementById(id); var error = document.getElementById(id + '-error'); if (field) field.classList.add('has-error'); if (error) { error.textContent = msg; error.style.display = 'block'; } }
    function clearError(id) { var field = document.getElementById(id); var error = document.getElementById(id + '-error'); if (field) field.classList.remove('has-error'); if (error) error.style.display = 'none'; }
    document.getElementById('login-block').addEventListener('submit', function (e) {
      e.preventDefault(); clearError('login-email'); clearError('login-password'); var email = document.getElementById('login-email').value.trim(); var password = document.getElementById('login-password').value; var ok = true; if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showError('login-email', 'Enter a valid email address.'); ok = false; } if (password.length < 6) { showError('login-password', 'Password must be at least 6 characters.'); ok = false; } if (!ok) { return; } var btn = document.querySelector('#login-block button[type="submit"]'); btn.textContent = 'Signing inâ€¦'; btn.disabled = true; setTimeout(function () { document.getElementById('login-success').style.display = 'flex'; btn.textContent = 'Signed in'; btn.style.backgroundColor = '#2d6a4f'; }, 900);
    });
    document.getElementById('login-email').addEventListener('input', function () { clearError('login-email'); });
    document.getElementById('login-password').addEventListener('input', function () { clearError('login-password'); });
  </script>
</body>

</html>
